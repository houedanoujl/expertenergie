<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Quiz expert énergie</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; background: #e6f3f9; color: #1f2832;
      font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; cursor: default;
    }
    main { display: grid; gap: 18px; justify-items: center; text-align: center; padding: 24px; }
    h1 { margin: 0; font-size: 2.6rem; font-weight: 800; }
    p { margin: 0; font-size: 1.2rem; color: #44525f; font-weight: 600; max-width: 40ch; }
    .bolt { width: 84px; height: 84px; border-radius: 50%; background: #ed7f06; border: 4px solid #1f2832; display: grid; place-items: center; animation: pulse 1.4s ease-in-out infinite; }
    .err .bolt { background: #f5c242; animation: none; }
    @keyframes pulse { 50% { transform: scale(1.08); box-shadow: 0 0 0 14px rgba(237, 127, 6, .18); } }
  </style>
</head>
<body>
  <main>
    <div class="bolt" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#1f2832" stroke-width="2.2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z" /></svg>
    </div>
    <h1>Quiz expert énergie</h1>
    <p id="msg">Mise sous tension…</p>
  </main>
  <script>
    const msg = new URLSearchParams(location.search).get('msg')
    if (msg) { document.getElementById('msg').textContent = msg; document.body.classList.add('err') }
  </script>
</body>
</html>
